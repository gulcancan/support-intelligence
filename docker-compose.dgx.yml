# ═══════════════════════════════════════════════════════════
# docker-compose for DGX Spark (Grace Blackwell GPU)
#
# Usage:
#   docker compose -f docker-compose.dgx.yml up -d
#   docker compose -f docker-compose.dgx.yml run --rm ingest
#   docker compose -f docker-compose.dgx.yml run --rm train
# ═══════════════════════════════════════════════════════════

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support_pass
      POSTGRES_DB: support_intelligence
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.9.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://support:support_pass@postgres:5432/support_intelligence
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy

  # ── GPU-enabled application ──
  app:
    build:
      context: .
      dockerfile: Dockerfile.dgx
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://support:support_pass@postgres:5432/support_intelligence
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_DIR: /app/models
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data:ro
      - model_cache:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── Ingest job (no GPU needed) ──
  ingest:
    build:
      context: .
      dockerfile: Dockerfile.dgx
    command: python -m scripts.run_ingest
    environment:
      DATABASE_URL: postgresql://support:support_pass@postgres:5432/support_intelligence
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data:ro
      - model_cache:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    profiles: ["tools"]

  # ── Training job (GPU-accelerated) ──
  train:
    build:
      context: .
      dockerfile: Dockerfile.dgx
    # DGX Spark: 128GB unified memory allows large batches
    # --batch-size 128 is comfortable; try 256 if you want to push it
    command: >
      python -m scripts.train
        --data /app/data/raw/tickets.json
        --both
        --optuna-trials 20
        --epochs 5
        --batch-size 128
        --model-dir /app/models
    environment:
      DATABASE_URL: postgresql://support:support_pass@postgres:5432/support_intelligence
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_DIR: /app/models
    volumes:
      - ./data:/app/data:ro
      - model_cache:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: ["tools"]

volumes:
  pg_data:
  qdrant_data:
  mlflow_artifacts:
  model_cache:
